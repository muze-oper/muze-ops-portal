<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operation Resource Planning — Muze Tech Ops Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f4f6fc; color: #1c2340; font-family: 'Outfit', 'Noto Sans Thai', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #4f5bd5; text-decoration: none; }
    a:hover { color: #6f7bf0; }

    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 28px; background: #04122e; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand a { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: #8fa6cc; }
    .brand a:hover { color: #fff; }
    .brand .divider { width: 1px; height: 20px; background: rgba(255,255,255,.16); }
    .brand .page-name { font-size: 15px; font-weight: 700; color: #fff; }
    .logout-btn {
      flex: none; display: flex; align-items: center; gap: 7px; padding: 9px 16px;
      background: #5b5fef; border: none; border-radius: 24px;
      font: 600 13px/1 'Outfit', sans-serif; color: #fff; cursor: pointer;
    }
    .logout-btn:hover { background: #4b4fe0; }

    .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 24px 28px 16px; max-width: 1400px; margin: 0 auto; }
    .page-title { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
    .subtitle { margin: 2px 0 0; font-size: 13px; color: #6b7396; }
    .refresh-btn {
      flex: none; padding: 8px 14px; border-radius: 10px; border: 1px solid #dfe3f2; background: #fff;
      font: 600 12.5px 'Outfit', sans-serif; color: #4b5170; cursor: pointer;
    }
    .refresh-btn:hover { border-color: #5b5fef; color: #4b4fe0; }

    /* One record = one row now (was a multi-row card) - each field is its
       own tiny label+control stack, laid out side by side instead of
       stacked, so a record never wraps past a single line. */
    .row-card {
      display: flex; align-items: flex-end; gap: 8px; background: #fff; border: 1px solid #eceef8;
      border-radius: 12px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(30,41,89,.05);
    }
    .row-card .field { display: flex; flex-direction: column; flex: none; }
    .row-card .field.f-start, .row-card .field.f-end { width: 64px; }
    .row-card .field.f-status { width: 108px; }
    .row-card .field.f-project, .row-card .field.f-pic { width: 88px; }
    .row-card .field.f-topic-wrap { flex: 1.3; min-width: 140px; }
    .row-card .field.f-doing-wrap { flex: 1; min-width: 120px; }
    .row-card .field.f-link-wrap { width: 180px; }
    .row-card input, .row-card select {
      width: 100%; padding: 7px 9px; border: 1px solid #e3e6f2; border-radius: 8px;
      font: 500 12.5px 'Outfit', 'Noto Sans Thai', sans-serif; color: #1c2340; background: #fbfbfe;
    }
    .row-card select { cursor: pointer; }
    .row-card input:focus, .row-card select:focus { outline: none; border-color: #5b5fef; background: #fff; }
    .field-label { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #b0b7cf; margin-bottom: 3px; display: block; }
    .link-field { display: flex; gap: 4px; }
    .link-input { flex: 1; min-width: 0; color: #4f5bd5; }
    .link-open-btn {
      flex: none; width: 30px; display: flex; align-items: center; justify-content: center;
      border: 1px solid #e3e6f2; border-radius: 8px; background: #fbfbfe; color: #8891b0; cursor: pointer;
    }
    .link-open-btn:hover { border-color: #5b5fef; color: #4b4fe0; background: #fff; }
    .link-open-btn:disabled { cursor: default; opacity: .45; }
    .link-open-btn:disabled:hover { border-color: #e3e6f2; color: #8891b0; background: #fbfbfe; }
    .row-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
    .save-status { font-size: 10.5px; color: #8891b0; white-space: nowrap; }
    .save-status.ok { color: #1ec496; font-weight: 600; }
    .save-status.err { color: #d63b5c; font-weight: 600; }
    .save-btn {
      padding: 7px 16px; border-radius: 20px; border: none; background: #5b5fef; color: #fff;
      font: 600 12.5px 'Outfit', sans-serif; cursor: pointer; white-space: nowrap;
    }
    .save-btn:hover { background: #4b4fe0; }
    .save-btn:disabled { background: #c7cae8; cursor: default; }
    .empty, .loading { text-align: center; padding: 60px 20px; color: #8891b0; font-size: 13px; max-width: 1400px; margin: 0 auto; }

    .day-section { max-width: 1400px; margin: 0 auto; padding: 0 28px; }
    .day-heading-row { display: flex; align-items: baseline; gap: 10px; padding: 20px 0 10px; }
    .day-heading-row:first-child { padding-top: 4px; }
    .day-heading { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
    .day-heading-date { font-size: 12px; color: #8891b0; }
    .day-rows { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <a href="/">🏠 Workspaces</a>
      <span class="divider"></span>
      <span class="page-name">Operation Resource Planning</span>
    </div>
    <button type="button" class="logout-btn" onclick="location.href='/logout'">Logout</button>
  </header>

  <div class="title-row">
    <div>
      <h1 class="page-title">Operation Resource Planning</h1>
      <p class="subtitle">งานวันนี้และพรุ่งนี้</p>
    </div>
    <button type="button" class="refresh-btn" onclick="load()">🔄 รีเฟรช</button>
  </div>

  <div class="day-section" id="day-section-0">
    <div class="day-heading-row">
      <h2 class="day-heading">วันนี้</h2>
      <span class="day-heading-date" id="date-label-0">กำลังโหลด...</span>
    </div>
    <div class="day-rows" id="rows-0"><div class="loading">กำลังโหลดข้อมูล...</div></div>
  </div>

  <div class="day-section" id="day-section-1">
    <div class="day-heading-row">
      <h2 class="day-heading">พรุ่งนี้</h2>
      <span class="day-heading-date" id="date-label-1">กำลังโหลด...</span>
    </div>
    <div class="day-rows" id="rows-1"><div class="loading">กำลังโหลดข้อมูล...</div></div>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Same option sets already used elsewhere on the portal for this exact
    // kind of field, so Resource Planning doesn't invent its own separate
    // vocabulary: PIC = Email Digest's assignee roster, PROJECT = the same
    // four client projects the landing page/Email Digest are organized
    // around, STATUS = Email Digest's own per-item status list.
    const PIC_OPTIONS = ['Aum', 'Noon', 'Beach', 'Aon', 'Noah'];
    const PROJECT_OPTIONS = ['TVN', 'KTC', 'MTS', 'Nissan'];
    const STATUS_OPTIONS = ['To Do', 'Scoping', 'Processing', 'Ignore', 'Done'];

    // If the sheet already has a value that isn't in the known list (older
    // free-text data), it's kept as an extra option instead of silently
    // dropped/overwritten the moment this row loads.
    function selectOptionsHtml(list, current) {
      const options = list.includes(current) || !current ? list : [current, ...list];
      return '<option value=""></option>' + options.map(v =>
        `<option value="${escapeHtml(v)}"${v === current ? ' selected' : ''}>${escapeHtml(v)}</option>`
      ).join('');
    }

    // Cell background mirrors the actual Google Sheet cell (manual fill or a
    // conditional-formatting rule - the backend already resolved either into
    // one hex color per field). Falls back to nothing (the field's own CSS
    // background) when the sheet cell has no color.
    function bg(color) {
      return color ? ` style="background:${color}"` : '';
    }

    function openLink(btn) {
      const url = (btn.previousElementSibling.value || '').trim();
      if (!url) return;
      window.open(/^https?:\/\//i.test(url) ? url : `https://${url}`, '_blank', 'noopener');
    }

    function rowCardHtml(item) {
      const c = item.colors || {};
      return `
        <div class="row-card" data-row="${item.rowNumber}">
          <div class="field f-start"><span class="field-label">Start</span><input class="f-startTime" value="${escapeHtml(item.startTime)}"${bg(c.startTime)}></div>
          <div class="field f-end"><span class="field-label">End</span><input class="f-endTime" value="${escapeHtml(item.endTime)}"${bg(c.endTime)}></div>
          <div class="field f-status"><span class="field-label">Status</span><select class="f-status"${bg(c.status)}>${selectOptionsHtml(STATUS_OPTIONS, item.status)}</select></div>
          <div class="field f-project"><span class="field-label">Project</span><select class="f-project"${bg(c.project)}>${selectOptionsHtml(PROJECT_OPTIONS, item.project)}</select></div>
          <div class="field f-pic"><span class="field-label">PIC</span><select class="f-pic"${bg(c.pic)}>${selectOptionsHtml(PIC_OPTIONS, item.pic)}</select></div>
          <div class="field f-topic-wrap"><span class="field-label">Topic</span><input class="f-topic" value="${escapeHtml(item.topic)}"${bg(c.topic)}></div>
          <div class="field f-doing-wrap"><span class="field-label">Doing</span><input class="f-doing" value="${escapeHtml(item.doing)}"${bg(c.doing)}></div>
          <div class="field f-link-wrap">
            <span class="field-label">Link</span>
            <div class="link-field">
              <input class="link-input f-link" value="${escapeHtml(item.link)}" placeholder="https://..."${bg(c.link)} oninput="this.nextElementSibling.disabled = !this.value.trim()">
              <button type="button" class="link-open-btn" title="เปิดลิงก์" onclick="openLink(this)"${item.link ? '' : ' disabled'}>↗</button>
            </div>
          </div>
          <div class="row-actions">
            <span class="save-status"></span>
            <button type="button" class="save-btn" onclick="saveRow(${item.rowNumber}, this)">บันทึก</button>
          </div>
        </div>`;
    }

    function load() {
      [0, 1].forEach(i => {
        document.getElementById(`rows-${i}`).innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
      });
      fetch('/api/resource-planning/upcoming')
        .then(r => r.json())
        .then(({ days = [] }) => {
          days.forEach((day, i) => {
            const container = document.getElementById(`rows-${i}`);
            if (!container) return;
            document.getElementById(`date-label-${i}`).textContent = day.dateLabel || '';
            container.innerHTML = day.items.length
              ? day.items.map(rowCardHtml).join('')
              : '<div class="empty">ยังไม่มีรายการ</div>';
          });
        })
        .catch(() => {
          [0, 1].forEach(i => {
            document.getElementById(`rows-${i}`).innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ</div>';
          });
        });
    }

    function saveRow(rowNumber, btn) {
      const card = btn.closest('.row-card');
      const status = card.querySelector('.save-status');
      const payload = {
        startTime: card.querySelector('.f-startTime').value,
        endTime: card.querySelector('.f-endTime').value,
        status: card.querySelector('.f-status').value,
        project: card.querySelector('.f-project').value,
        pic: card.querySelector('.f-pic').value,
        topic: card.querySelector('.f-topic').value,
        doing: card.querySelector('.f-doing').value,
        link: card.querySelector('.f-link').value,
      };
      btn.disabled = true;
      status.textContent = 'กำลังบันทึก...';
      status.className = 'save-status';
      fetch(`/api/resource-planning/row/${rowNumber}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
          if (!ok) throw new Error(data.message || data.error || 'save failed');
          status.textContent = 'บันทึกแล้ว ✓';
          status.className = 'save-status ok';
        })
        .catch(err => {
          status.textContent = 'บันทึกไม่สำเร็จ: ' + err.message;
          status.className = 'save-status err';
        })
        .finally(() => { btn.disabled = false; });
    }

    load();
  </script>
</body>
</html>

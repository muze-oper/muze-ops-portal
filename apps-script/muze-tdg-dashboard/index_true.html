<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Muze TDG Dashboard</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TDG Dashboard">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Google Sans', Arial, sans-serif; background: #f6f8fc; color: #202124; height: 100vh; display: flex; flex-direction: column; }

  /* ===== Header ===== */
  .header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .header-logo { font-size: 17px; font-weight: 600; color: #1a73e8; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #34a853; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .countdown { font-size: 12px; color: #5f6368; min-width: 80px; text-align: right; }
  .refresh-btn { background: none; border: 1px solid #dadce0; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 12px; color: #5f6368; }
  .refresh-btn:hover { background: #f1f3f4; }
  .user-chip { display: flex; align-items: center; gap: 7px; background: #f1f3f4; border-radius: 20px; padding: 4px 12px 4px 4px; font-size: 12px; color: #3c4043; }
  .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: #1a73e8; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .user-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== Tabs ===== */
  .tabs { background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; padding: 0 12px; flex-shrink: 0; }
  .tab { padding: 11px 16px; cursor: pointer; font-size: 13px; font-weight: 500; color: #5f6368; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .tab:hover { color: #1a73e8; background: #f1f3f4; }
  .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
  .badge { background: #1a73e8; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 600; }
  .badge.zero { background: #9aa0a6; }

  /* ===== Content Area ===== */
  .content { flex: 1; overflow: hidden; min-height: 0; }
  .tab-panel { display: none; height: 100%; overflow-y: auto; }
  .tab-panel.active { display: block; }
  #panel-ai.active { display: flex; flex-direction: column; overflow-y: hidden; }

  /* ===== Email List ===== */
  .email-list { background: #fff; margin: 12px; border-radius: 8px; border: 1px solid #e0e0e0; overflow: hidden; }
  .email-row { display: flex; align-items: flex-start; padding: 10px 16px; border-bottom: 1px solid #f1f3f4; gap: 10px; cursor: pointer; transition: background 0.1s; }
  .email-row:last-child { border-bottom: none; }
  .email-row:hover { background: #e8f0fe; }
  .email-row.read { background: #f6f8fc; }
  .email-row.new-arrival { animation: highlight 2s ease; }
  @keyframes highlight { 0%{background:#c6dafc} 100%{background:inherit} }
  .dot-col { padding-top: 5px; flex-shrink: 0; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: #1a73e8; }
  .read-dot { width: 8px; height: 8px; }
  .email-body { flex: 1; min-width: 0; }
  .subject-line { font-size: 14px; color: #202124; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
  .email-row.unread .subject-line { font-weight: 700; }
  .email-row.read .subject-line { font-weight: 400; color: #444; }
  .meta-line { font-size: 12px; color: #5f6368; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .sender-name { font-weight: 500; color: #3c4043; }
  .date-col { font-size: 12px; color: #5f6368; white-space: nowrap; flex-shrink: 0; padding-top: 3px; }
  .load-more-wrap { margin: 0 12px 12px; }
  .load-more-btn { background: #fff; border: 1px solid #dadce0; border-radius: 4px; padding: 8px; font-size: 13px; color: #1a73e8; cursor: pointer; width: 100%; }
  .load-more-btn:hover { background: #f1f3f4; }
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; gap: 12px; color: #5f6368; font-size: 14px; }
  .spinner { width: 20px; height: 20px; border: 2px solid #e0e0e0; border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; color: #9aa0a6; font-size: 14px; gap: 8px; }
  .error-msg { margin: 12px; padding: 12px 16px; background: #fce8e6; border-radius: 8px; color: #c5221f; font-size: 13px; }

  /* ===== Status Pill ===== */
  .status-pill { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: none; transition: transform 0.1s; }
  .status-pill:hover { transform: scale(1.15); }
  .sp-action  { background: #fce8e6; color: #c62828; }
  .sp-aware   { background: #fff8e1; color: #e65100; }
  .sp-auto    { background: #f1f3f4; color: #9aa0a6; }
  .sp-done    { background: #e8f5e9; color: #2e7d32; }
  .sp-carried { background: #ede7f6; color: #6a1b9a; }
  .email-row.done { opacity: 0.45; }
  .email-row.done .subject-line { text-decoration: line-through; }

  /* ===== Status Dropdown ===== */
  .status-dropdown { position: fixed; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.18); z-index: 200; min-width: 160px; overflow: hidden; }
  .status-opt { padding: 9px 16px; font-size: 13px; cursor: pointer; }
  .status-opt:hover { background: #f1f3f4; }
  .status-opt.divider { border-top: 1px solid #f1f3f4; }

  /* ===== Chat Modal (TDG Thread) ===== */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .chat-modal { background: #fff; border-radius: 16px; width: 700px; max-width: 95vw; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.25); overflow: hidden; }
  .chat-header { padding: 18px 22px 16px; background: linear-gradient(135deg,#1a73e8,#1557b0); color: #fff; flex-shrink: 0; }
  .chat-header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .chat-ticket-pill { background: rgba(255,255,255,.22); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 600; letter-spacing: .4px; }
  .chat-subject { font-size: 15px; font-weight: 700; line-height: 1.4; }
  .chat-header-meta { font-size: 11px; opacity: .75; margin-top: 5px; }
  .chat-body { flex: 1; overflow-y: auto; padding: 20px 16px; background: #eef1f5; display: flex; flex-direction: column; gap: 16px; }
  .chat-loading { display: flex; align-items: center; justify-content: center; padding: 40px; gap: 10px; color: #5f6368; font-size: 13px; }
  .msg-row { display: flex; gap: 10px; align-items: flex-end; }
  .msg-row.muze { flex-direction: row-reverse; }
  .msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .msg-col { display: flex; flex-direction: column; max-width: 68%; }
  .msg-row.muze .msg-col { align-items: flex-end; }
  .msg-row.tdg .msg-col  { align-items: flex-start; }
  .msg-sender { font-size: 11px; font-weight: 600; color: #5f6368; margin-bottom: 4px; padding: 0 4px; }
  .msg-bubble { padding: 11px 15px; font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .msg-row.tdg .msg-bubble  { background: #fff; color: #202124; border-radius: 18px 18px 18px 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .msg-row.muze .msg-bubble { background: #1a73e8; color: #fff; border-radius: 18px 18px 4px 18px; }
  .msg-time { font-size: 10px; color: #9aa0a6; margin-top: 4px; padding: 0 5px; }
  .chat-footer { padding: 14px 22px; border-top: 1px solid #e8eaed; display: flex; justify-content: flex-end; gap: 10px; background: #fff; flex-shrink: 0; }
  .btn-close { background: none; border: 1px solid #dadce0; border-radius: 4px; padding: 7px 18px; cursor: pointer; font-size: 13px; color: #5f6368; }
  .btn-close:hover { background: #f1f3f4; }
  .btn-gmail { background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 7px 18px; cursor: pointer; font-size: 13px; }
  .btn-gmail:hover { background: #1557b0; }

  /* ===== AI Chat Panel ===== */
  .ai-wrap { display: flex; flex-direction: column; height: 100%; }
  .ai-topbar { background: #fff; border-bottom: 1px solid #e8eaed; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .ai-ctx-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5f6368; cursor: pointer; }
  .ai-ctx-label input[type=checkbox] { width: 16px; height: 16px; accent-color: #1a73e8; cursor: pointer; }
  .ai-clear-btn { background: none; border: 1px solid #dadce0; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 12px; color: #9aa0a6; }
  .ai-clear-btn:hover { background: #fce8e6; color: #c5221f; border-color: #f4b8b5; }


  .tab-now-img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 4px; }
  .ai-now-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: transparent; }
  .ai-now-hero { width: 130px; height: 130px; object-fit: contain; margin-bottom: 8px; }
  .ai-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: #f6f8fc; }
  .ai-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; color: #9aa0a6; text-align: center; padding: 24px; }
  .ai-empty-icon { font-size: 48px; }
  .ai-empty-title { font-size: 16px; font-weight: 600; color: #5f6368; }
  .ai-empty-sub { font-size: 13px; line-height: 1.5; max-width: 300px; }
  .ai-suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .ai-chip { background: #fff; border: 1px solid #dadce0; border-radius: 20px; padding: 6px 14px; font-size: 12px; color: #1a73e8; cursor: pointer; }
  .ai-chip:hover { background: #e8f0fe; }
  .ai-msg-row { display: flex; gap: 10px; max-width: 82%; }
  .ai-msg-row.user { flex-direction: row-reverse; align-self: flex-end; max-width: 78%; }
  .ai-msg-row.ai   { align-self: flex-start; }
  .ai-msg-icon { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .ai-msg-row.user .ai-msg-icon { background: #1a73e8; }
  .ai-msg-row.ai   .ai-msg-icon { background: #e8f5e9; }
  .ai-msg-body { display: flex; flex-direction: column; gap: 3px; }
  .ai-msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .ai-msg-row.user .ai-msg-bubble { background: #1a73e8; color: #fff; border-radius: 16px 16px 4px 16px; }
  .ai-msg-row.ai   .ai-msg-bubble { background: #fff; color: #202124; border-radius: 16px 16px 16px 4px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .ai-msg-time { font-size: 10px; color: #bdbdbd; padding: 0 3px; }
  .ai-msg-row.user .ai-msg-time { text-align: right; }
  .ai-thinking { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; border-radius: 16px 16px 16px 4px; box-shadow: 0 1px 4px rgba(0,0,0,.1); font-size: 13px; color: #9aa0a6; }
  .dots-anim span { animation: blink 1.4s infinite; opacity: 0; font-size: 18px; }
  .dots-anim span:nth-child(2) { animation-delay: 0.2s; }
  .dots-anim span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
  .ai-input-area { background: #fff; border-top: 1px solid #e8eaed; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .ai-input-area textarea { flex: 1; border: 1px solid #dadce0; border-radius: 20px; padding: 10px 16px; font-size: 14px; resize: none; outline: none; line-height: 1.5; max-height: 120px; font-family: inherit; }
  .ai-input-area textarea:focus { border-color: #1a73e8; }
  .ai-send-btn { background: #1a73e8; border: none; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ai-send-btn:hover { background: #1557b0; }
  .ai-send-btn:disabled { background: #dadce0; cursor: default; }
  .ai-send-icon { width: 20px; height: 20px; fill: #fff; }
  .ai-ctx-badge { background: #e8f0fe; color: #1a73e8; border-radius: 12px; padding: 2px 8px; font-size: 11px; font-weight: 600; }

  /* ===== Mobile ===== */
  @media (max-width: 640px) {
    .header { padding: 8px 12px; gap: 8px; }
    .header-logo { font-size: 14px; }
    .countdown { display: none; }
    .refresh-btn { padding: 5px 9px; font-size: 11px; }
    .user-name { display: none; }
    .user-chip { padding: 4px; background: none; }
    .tabs { padding: 0 4px; }
    .tab { padding: 9px 12px; font-size: 12px; gap: 4px; }
    .email-list { margin: 8px; }
    .email-row { padding: 10px 12px; gap: 8px; }
    .subject-line { font-size: 13px; }
    .meta-line, .date-col { font-size: 11px; }
    .modal-overlay { align-items: flex-end; }
    .chat-modal { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; }
    .chat-header { padding: 14px 16px 12px; padding-top: calc(14px + env(safe-area-inset-top)); }
    .chat-subject { font-size: 13px; }
    .chat-body { padding: 14px 10px; gap: 12px; }
    .msg-col { max-width: 82%; }
    .msg-bubble { font-size: 13px; padding: 9px 13px; }
    .chat-footer { padding: 10px 14px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .btn-close, .btn-gmail { padding: 9px 14px; font-size: 13px; flex: 1; text-align: center; }
    .ai-messages { padding: 12px; gap: 10px; }
    .ai-msg-row { max-width: 92%; }
    .ai-msg-bubble { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">📺 Muze TDG Dashboard</div>
  <div class="header-right">
    <div class="live-dot"></div>
    <span class="countdown" id="countdown">กำลังโหลด...</span>
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄 Refresh</button>
    <div class="user-chip" id="userChip" title="">
      <div class="user-avatar" id="userAvatar">?</div>
      <span class="user-name" id="userName">...</span>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('tdg')" id="tab-tdg">

// ===== Helpers =====
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatSender(raw) {
  if (!raw) return '(ไม่ระบุ)';
  var m = raw.match(/^"?(.+?)"?\s*<[^>]+>/);
  if (m) return m[1].trim();
  var em = raw.match(/^([^@]+)@(.+)$/);
  if (em) {
    var generic = /^(support|noreply|no-reply|info|mail|hello|contact|admin|postmaster|do-not-reply|donotreply|notification)$/i.test(em[1]);
    return generic ? em[2] : em[1];
  }
  return raw;
}
function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  return d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year: d.getFullYear()!==now.getFullYear()?'numeric':undefined});
}
function formatDateFull(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('th-TH', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
function formatTime(d) {
  return d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
}
function isThreadUnread(t) { return !window._readLocally.has(t.id) && t.isUnread; }

const AVATAR_COLORS = ['#e53935','#8e24aa','#1e88e5','#00897b','#43a047','#fb8c00','#f4511e','#607d8b','#d81b60','#6d4c41'];
function avatarColor(name) {
  var h = 0; for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}
function initials(name) {
  var clean = name.replace(/@.*$/, '').replace(/[._]/g, ' ').trim();
  var parts = clean.split(/\s+/).filter(Boolean);
  return parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : clean.slice(0,2).toUpperCase();
}

// ===== Email Classification =====
function classifyEmail(t) {
  if (!isThreadUnread(t)) return null;
  var ageMs = Date.now() - new Date(t.date).getTime();
  var isOld = ageMs > 24 * 60 * 60 * 1000;
  return isOld ? 'aware' : 'action';
}

var _statusOverride = {};
try { _statusOverride = JSON.parse(localStorage.getItem('muze_status_tdg') || '{}'); } catch(e) {}

function saveStatus() {
  try { localStorage.setItem('muze_status_tdg', JSON.stringify(_statusOverride)); } catch(e) {}
}
function getEffectiveStatus(t) {
  var ov = _statusOverride[t.id];
  if (ov !== undefined) {
    var savedCount  = (typeof ov === 'object') ? ov.msgCount : 0;
    var savedStatus = (typeof ov === 'object') ? ov.status : ov;
    if (savedStatus === 'done' && t.msgCount > savedCount) {
      delete _statusOverride[t.id]; saveStatus(); return classifyEmail(t);
    }
    return savedStatus;
  }
  return classifyEmail(t);
}
function setStatusOverride(threadId, status) {
  if (status === 'reset') {
    delete _statusOverride[threadId];
  } else {
    var t = (window._threadCache['tdg'] || []).find(function(x) { return x.id === threadId; });
    _statusOverride[threadId] = { status: status, msgCount: t ? t.msgCount : 0 };
  }
  saveStatus(); closeStatusDropdown(); renderTDG(); updateCtxBadge();
}

var _statusDropdownEl = null;
function closeStatusDropdown() {
  if (_statusDropdownEl) { _statusDropdownEl.remove(); _statusDropdownEl = null; }
}
function showStatusPicker(threadId, event) {
  event.stopPropagation(); closeStatusDropdown();
  var opts = [
    { s: 'action', label: '🔴 ต้อง Action' },
    { s: 'aware',  label: '🟡 ควรรับรู้' },
    { s: 'done',   label: '✅ Action แล้ว' },
    { s: 'reset',  label: '↩ รีเซ็ต', divider: true },
  ];
  var el = document.createElement('div');
  el.className = 'status-dropdown';
  el.innerHTML = opts.map(function(o) {
    return '<div class="status-opt' + (o.divider?' divider':'') + '" onclick="setStatusOverride(\'' + threadId + '\',\'' + o.s + '\')">' + o.label + '</div>';
  }).join('');
  var rect = event.currentTarget.getBoundingClientRect();
  el.style.top  = (rect.bottom + 6) + 'px';
  el.style.left = Math.max(8, rect.left - 120) + 'px';

  _statusDropdownEl = el;
  setTimeout(function() { document.addEventListener('click', closeStatusDropdown, { once: true }); }, 0);
}
function statusPillHtml(t) {
  var st = getEffectiveStatus(t);
  var map = { action: ['sp-action','●'], aware: ['sp-aware','●'], auto: ['sp-auto','·'], done: ['sp-done','✓'] };
  var parts = map[st] || ['sp-auto','·'];
  return '<button class="status-pill ' + parts[0] + '" onclick="showStatusPicker(\'' + t.id + '\',event)" title="เปลี่ยน status">' + parts[1] + '</button>';
}

// ===== TDG Chat Parser =====
function parseTDGChat(body) {
  var text = body;
  var cut = text.indexOf('add a comment to the request.');
  if (cut !== -1) text = text.slice(cut + 'add a comment to the request.'.length).replace(/^\n+/, '');
  text = text.replace(/\nPlease open\.\n[\s\S]*$/, '');
  text = text.replace(/\n?-{5,}\nThis email is a service[\s\S]*$/, '');
  text = text.replace(/\[W[A-Z0-9-]+\][\s\S]*$/, '').trim();
  var blocks = text.split(/-{20,}/).map(function(b) { return b.trim(); }).filter(Boolean);
  var DATE_RE = /^([\s\S]+?),\s*((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d+,\s*\d{4},\s*[\d:]+\s*GMT[+-]\d+)$/;
  var chats = [];
  for (var i = 0; i < blocks.length; i++) {
    var block = blocks[i];
    var lines = block.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; });
    if (lines.length === 0) continue;
    var senderLine = lines[0], contentStart = 1;
    if (!DATE_RE.test(senderLine) && lines[1] && /GMT[+-]\d+/.test(lines[1])) {
      senderLine = senderLine + ' ' + lines[1]; contentStart = 2;
    }
    var dateMatch = senderLine.match(DATE_RE);
    var sender = senderLine, dateStr = '';
    if (dateMatch) { sender = dateMatch[1].trim(); dateStr = dateMatch[2].trim(); }
    else { if (/^-+$/.test(sender) || sender.length < 3) continue; }
    var content = lines.slice(contentStart).join('\n').trim();
    content = content.replace(/\nPlease open\.[\s\S]*$/, '').trim();
    content = content.replace(/\nAttachment\(s\):[\s\S]*$/, '').trim();
    if (!content) continue;
    var userHandle = currentUserEmail ? currentUserEmail.replace(/@.*$/, '').toLowerCase() : 'noppasit';
    chats.push({ sender: sender, dateStr: dateStr, content: content, isMuze: sender.toLowerCase().includes(userHandle) });
  }
  return chats.reverse();
}
function extractTicketId(subject) {
  var m = subject.match(/\[TVS(\d+)\]/);
  return m ? 'TVS' + m[1] : '';
}
function extractTicketUrl(text) {
  var m = text.match(/(?:https?:\/\/)?support\.truedigital\.com\/hc\/requests\/(\d+)/);
  if (m) return 'https://support.truedigital.com/hc/requests/' + m[1];
  return null;
}

function openTDGChat(t) {
  currentThreadId = t.id; currentTicketUrl = null;
  var subject = t.subject || '(ไม่มีหัวข้อ)';
  document.getElementById('chatTicketId').textContent = extractTicketId(subject);
  document.getElementById('chatSubject').textContent  = subject.replace(/^\[Muze-[^\]]+\]\s*/,'');
  document.getElementById('chatMeta').textContent     = t.msgCount + ' ข้อความ · อัปเดต ' + formatDate(t.date);
  document.getElementById('chatBody').innerHTML       = '<div class="chat-loading"><div class="spinner"></div>กำลังโหลด...</div>';
  var ticketBtn = document.getElementById('ticketBtn');
  ticketBtn.textContent = 'เปิด Ticket ↗'; ticketBtn.style.opacity = '0.6';
  document.getElementById('chatOverlay').classList.add('open');
  markReadLocally(t.id);
  google.script.run
    .withSuccessHandler(function(data) {
      if (data.error) {
        document.getElementById('chatBody').innerHTML = '<div class="chat-loading" style="color:#c5221f">⚠️ ' + esc(data.error) + '</div>';
        ticketBtn.style.opacity = '1'; return;
      }
      var url = extractTicketUrl(data.body || '');
      if (url) currentTicketUrl = url;
      ticketBtn.style.opacity = '1';
      if (!currentTicketUrl) ticketBtn.textContent = 'เปิดใน Gmail ↗';
      var chats = parseTDGChat(data.body || '');
      if (chats.length === 0) {
        document.getElementById('chatBody').innerHTML = '<div class="chat-loading">ไม่พบเนื้อหา</div>'; return;
      }
      document.getElementById('chatBody').innerHTML = chats.map(function(c) {
        var side = c.isMuze ? 'muze' : 'tdg';
        var bg   = c.isMuze ? '#1a73e8' : avatarColor(c.sender);
        var av   = '<div class="msg-avatar" style="background:' + bg + '">' + esc(initials(c.sender)) + '</div>';
        return '<div class="msg-row ' + side + '">' + av
          + '<div class="msg-col"><div class="msg-sender">' + esc(c.sender) + '</div>'
          + '<div class="msg-bubble">' + esc(c.content) + '</div>'
          + '<div class="msg-time">' + esc(c.dateStr) + '</div></div></div>';
      }).join('');
      var cb = document.getElementById('chatBody'); cb.scrollTop = cb.scrollHeight;
    })
    .withFailureHandler(function(err) {
      document.getElementById('chatBody').innerHTML = '<div class="chat-loading" style="color:#c5221f">⚠️ ' + esc(err.message) + '</div>';
      ticketBtn.style.opacity = '1';
    })
    .getThreadBody(t.id);
}

// ===== TDG Tab Render =====
function markReadLocally(threadId) {
  if (window._readLocally.has(threadId)) return;
  window._readLocally.add(threadId);
  updateTDGBadge();
  google.script.run.markAsRead(threadId);
}
function updateTDGBadge() {
  var unread = tdgState.threads.filter(function(t) { return isThreadUnread(t); }).length;
  var badge = document.getElementById('badge-tdg');
  badge.textContent = unread > 0 ? unread : tdgState.threads.length;
  badge.className   = unread > 0 ? 'badge' : 'badge zero';
}

function renderTDG(newIds) {
  var panel = document.getElementById('panel-tdg');
  var threads = tdgState.threads;
  if (threads.length === 0 && tdgState.loading) {
    panel.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>'; return;
  }
  if (threads.length === 0) {
    panel.innerHTML = '<div class="empty"><div style="font-size:36px">✉️</div><div>ไม่มีอีเมล</div></div>';
    document.getElementById('badge-tdg').textContent = '0'; return;
  }
  var sorted = threads.slice().sort(function(a,b) { return new Date(b.date) - new Date(a.date); });
  window._threadCache['tdg'] = sorted;
  var rows = sorted.map(function(t, idx) {
    var isUnread = isThreadUnread(t);
    var isNew    = newIds && newIds.has(t.id);
    var st       = getEffectiveStatus(t);
    var isDone   = st === 'done';
    var subject  = (t.subject || '(ไม่มีหัวข้อ)').replace(/^\[Muze-[^\]]+\]\s*/,'');
    var rowClass = 'email-row ' + (isUnread?'unread':'read') + (isNew?' new-arrival':'') + (isDone?' done':'');
    return '<div class="' + rowClass + '" data-tid="' + t.id + '" onclick="openTDGChat(window._threadCache[\'tdg\'][' + idx + '])">'
      + '<div class="dot-col"><div class="' + (isUnread?'unread-dot':'read-dot') + '"></div></div>'
      + '<div class="email-body">'
      + '<div class="subject-line">' + esc(subject) + '</div>'
      + '<div class="meta-line"><span class="sender-name">' + (t.msgCount>1?t.msgCount+' ข้อความ · ':'') + esc(formatSender(t.sender)) + '</span> · ' + esc(t.snippet) + '</div>'
      + '</div>'
      + '<div class="date-col">' + esc(formatDate(t.date)) + '</div>'
      + statusPillHtml(t)
      + '</div>';
  }).join('');
  var moreBtn = tdgState.hasMore ? '<div class="load-more-wrap"><button class="load-more-btn" onclick="loadMore()" ' + (tdgState.loading?'disabled':'') + '>โหลดเพิ่มเติม</button></div>' : '';
  panel.innerHTML = '<div class="email-list">' + rows + '</div>' + moreBtn;
  updateTDGBadge();
}

function loadTDG() {
  loadedTabs['tdg'] = true;
  tdgState = { threads: [], nextStart: 0, hasMore: false, loading: true, loaded: false };
  renderTDG();
  google.script.run
    .withSuccessHandler(function(data) {
      if (data.error) {
        document.getElementById('panel-tdg').innerHTML = '<div class="error-msg">⚠️ ' + esc(data.error) + '</div>';
        tdgState.loading = false; return;
      }
      tdgState.threads   = data.threads || [];
      tdgState.nextStart = data.nextStart || 0;
      tdgState.hasMore   = data.hasMore || false;
      tdgState.loading   = false;
      tdgState.loaded    = true;
      renderTDG();
      updateCtxBadge();
    })
    .withFailureHandler(function(err) {
      document.getElementById('panel-tdg').innerHTML = '<div class="error-msg">⚠️ ' + esc(err.message) + '</div>';
      tdgState.loading = false;
    })
    .getThreads(TDG_QUERY, 0);
}

function loadMore() {
  if (!tdgState.hasMore || tdgState.loading) return;
  tdgState.loading = true; renderTDG();
  google.script.run
    .withSuccessHandler(function(data) {
      tdgState.threads   = tdgState.threads.concat(data.threads || []);
      tdgState.nextStart = data.nextStart || tdgState.nextStart;
      tdgState.hasMore   = data.hasMore || false;
      tdgState.loading   = false;
      renderTDG(); updateCtxBadge();
    })
    .withFailureHandler(function() { tdgState.loading = false; renderTDG(); })
    .getThreads(TDG_QUERY, tdgState.nextStart);
}

function silentRefresh() {
  if (!tdgState.loaded) return;
  var prevIds = new Set(tdgState.threads.map(function(t) { return t.id; }));
  google.script.run
    .withSuccessHandler(function(data) {
      if (data.error || !data.threads) return;
      var fresh   = data.threads;
      var newIds  = new Set(fresh.filter(function(t) { return !prevIds.has(t.id); }).map(function(t) { return t.id; }));
      var freshSet= new Set(fresh.map(function(t) { return t.id; }));
      tdgState.threads   = fresh.concat(tdgState.threads.filter(function(t) { return !freshSet.has(t.id); }));
      tdgState.nextStart = data.nextStart || 0;
      tdgState.hasMore   = data.hasMore || false;
      renderTDG(newIds);
      updateCtxBadge();
    })
    .getThreads(TDG_QUERY, 0);
}

function manualRefresh() {

  if (loadedTabs['tdg']) loadTDG();
}

function resetCountdown() {
  countdownVal = REFRESH_INTERVAL; clearInterval(countdownTimer);
  document.getElementById('countdown').textContent = countdownVal + 's';
  countdownTimer = setInterval(function() {
    countdownVal--;
    if (countdownVal <= 0) {
      document.getElementById('countdown').textContent = 'กำลังอัปเดต...';
      clearInterval(countdownTimer);
      silentRefresh();
      setTimeout(resetCountdown, 3000);
    } else {
      document.getElementById('countdown').textContent = countdownVal + 's';
    }
  }, 1000);
}

function updateCtxBadge() {
  var count = tdgState.threads.length;
  document.getElementById('ctxBadge').textContent = count + ' tickets';
}

function buildEmailContext() {
  if (!document.getElementById('ctxToggle').checked) return '';
  if (tdgState.threads.length === 0) return '';
  var lines = ['TDG Tickets ใน inbox (' + tdgState.threads.length + ' รายการ):'];
  var sorted = tdgState.threads.slice().sort(function(a,b) { return new Date(b.date) - new Date(a.date); });
  sorted.slice(0, 30).forEach(function(t, i) {
    var st  = getEffectiveStatus(t) || 'read';
    var age = Math.round((Date.now() - new Date(t.date).getTime()) / 3600000);
    var ageStr = age < 24 ? age + 'h' : Math.round(age/24) + 'd';
    lines.push((i+1) + '. [' + st.toUpperCase() + '] ' + (t.subject||'no subject') + ' (จาก: ' + formatSender(t.sender) + ', ' + ageStr + ' ago, ' + t.msgCount + ' msgs)');
    if (t.snippet) lines.push('   → ' + t.snippet.substring(0, 100));
  });
  return lines.join('\n');
}

// ===== Rule-Based Chatbot =====
function formatBotText(text) {
  var t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\n/g, '<br>');
  return t;
}

function localBot(question) {
  var raw = (question || '').toLowerCase();
  var q   = expandQuery(raw);
  var threads = tdgState.threads || [];

  // --- TVS Error KB lookup (ดึงจาก muze-ops-portal) ---
  var errMatch = raw.match(/\b(e\d{4}(?:[-:\.]\d+)*)\b/i);
  if (errMatch && kbData.length > 0) {
    var searchCode = errMatch[1].replace(/[-:\.]/g, '').toLowerCase();
    var found = null;
    for (var ki = 0; ki < kbData.length; ki++) {
      var kbCode = kbData[ki].code.replace(/[-:\.]/g, '').toLowerCase();
      // match แบบ fuzzy: ถ้า code ที่ user พิมพ์เป็น prefix ของ kbCode หรือตรงกัน
      if (kbCode === searchCode || kbCode.indexOf(searchCode) === 0 || searchCode.indexOf(kbCode) === 0) {
        found = kbData[ki];
        break;
      }
    }
    if (found) {
      var lines = ['🔴 **' + found.code + ' — ' + found.title + '**\n',
                   '**สาเหตุ:** ' + found.cause + '\n',
                   '**วิธีแก้ไข:**'];
      found.wa.forEach(function(s, i) { lines.push((i+1) + '. ' + s); });
      if (found.note) lines.push('\n⚠️ ' + found.note);
      lines.push('\n📚 *ข้อมูลจาก TVS Error KB (muze-ops-portal)*');
      return lines.join('\n');
    }
  }
  // ถ้ามี error code แต่ kbData ยังไม่โหลด → poll แล้ว auto-update message
  if (errMatch && kbData.length === 0) {
    var retryQ = question;
    var retries = 0;
    var poll = setInterval(function() {
      retries++;
      if (kbData.length > 0 || retries > 24) { // รอสูงสุด 12 วิ
        clearInterval(poll);
        if (kbData.length > 0) {
          for (var i = aiHistory.length - 1; i >= 0; i--) {
            if (aiHistory[i].role === 'ai') {
              aiHistory[i].text = localBot(retryQ);
              renderAIMessages();
              break;
            }
          }
        }
      }
    }, 500);
    return '⏳ กำลังโหลด TVS Error KB อยู่ค่ะ รอแป๊บนะคะ 🐥';
  }

  // --- Context-aware ticket queries ---
  if (/สรุป|action|ต้อง.*ทำ|urgent|เร่ง|pending|รอ/.test(q) && !/ตอบ|reply|draft|template/.test(q)) {
    var actionList = threads.filter(function(t) {
      var st = getEffectiveStatus(t);
      return st === 'action' || st === 'aware';
    });
    if (actionList.length === 0) return '✅ ตอนนี้ไม่มี ticket ที่ต้อง action เลยนะคะ เยี่ยมมากค่า! 🎉';
    var lines = ['📋 **Tickets ที่ต้อง Action (' + actionList.length + ' รายการ) นะคะ:**\n'];
    actionList.slice(0, 10).forEach(function(t, i) {
      var st = getEffectiveStatus(t);
      var age = Math.round((Date.now() - new Date(t.date).getTime()) / 3600000);
      var ageStr = age < 24 ? age + 'h' : Math.round(age/24) + 'd';
      lines.push((i+1) + '. [' + st.toUpperCase() + '] ' + (t.subject || 'no subject') + ' (' + ageStr + ')');
    });
    return lines.join('\n');
  }

  if (/เก่า|ค้าง|นาน|oldest/.test(q)) {
    if (threads.length === 0) return '📭 ยังไม่มีข้อมูล ticket เลยนะคะ รอโหลดสักครู่ก่อนนะคะ 🙏';
    var sorted = threads.slice().sort(function(a,b) { return new Date(a.date) - new Date(b.date); });
    var lines = ['⏰ **Tickets ที่ค้างนานที่สุด นะคะ:**\n'];
    sorted.slice(0, 5).forEach(function(t, i) {
      var age = Math.round((Date.now() - new Date(t.date).getTime()) / 3600000);
      var ageStr = age < 24 ? age + 'h' : Math.round(age/24) + 'd';
      lines.push((i+1) + '. ' + (t.subject || 'no subject') + ' — ' + ageStr + ' ที่แล้ว');
    });
    return lines.join('\n');
  }

  if (/น่าเป็นห่วง|concern|risk|เสี่ยง/.test(q)) {
    var old48 = threads.filter(function(t) {
      return (Date.now() - new Date(t.date).getTime()) / 3600000 > 48;
    });
    if (old48.length === 0) return '👍 ไม่มี ticket ค้างเกิน 48 ชั่วโมงเลยนะคะ ดีมากเลยค่า! 🎉';
    var lines = ['⚠️ **Tickets ที่น้อง Now เป็นห่วง (ค้าง > 48h):**\n'];
    old48.slice(0, 5).forEach(function(t, i) {
      var age = Math.round((Date.now() - new Date(t.date).getTime()) / 3600000);
      lines.push((i+1) + '. ' + (t.subject || 'no subject') + ' — ' + Math.round(age/24) + ' วัน');
    });
    return lines.join('\n');
  }

  if (/ตอบ|reply|draft|template|แนะนำ.*ticket|pending.*วิธี/.test(q)) {
    return '✍️ **น้อง Now แนะนำแนวทางตอบ Ticket ที่ pending นะคะ:**\n\n'
      + '1. Acknowledge: "ขอบคุณที่แจ้งปัญหานะคะ ทีมงานได้รับเรื่องแล้วค่ะ"\n'
      + '2. Status update: "ขณะนี้ทีมกำลังตรวจสอบ/ประสานงานอยู่นะคะ"\n'
      + '3. Timeline: "คาดว่าจะทราบผลภายใน X วันทำการค่ะ"\n'
      + '4. ขอข้อมูลเพิ่มเติม ถ้าต้องการ (S/N, screenshot, error code)\n'
      + '5. ปิดด้วย: "หากมีข้อสงสัยเพิ่มเติม สามารถแจ้งกลับมาได้เลยนะคะ 😊"\n\n'
      + '💡 น้อง Now แนะนำให้ตอบเร็วๆ นะคะ ลูกค้าจะได้รู้สึกดีขึ้นค่า~';
  }

  // --- KB keyword matching (weighted: longer keyword = more specific = higher score) ---
  var scores = KNOWLEDGE_BASE.map(function(kb) {
    var score = 0;
    kb.keywords.forEach(function(kw) {
      if (q.indexOf(kw) !== -1) {
        // Weight by keyword length: short kw=1pt, medium=2pt, long=3pt
        score += kw.length <= 3 ? 1 : kw.length <= 6 ? 2 : 3;
      }
    });
    return { kb: kb, score: score };
  });
  scores.sort(function(a, b) { return b.score - a.score; });

  if (scores[0].score > 0) {
    var reply = scores[0].kb.title + '\n\n' + scores[0].kb.answer;
    // Show related topic hint if 2nd score is at least 40% of 1st
    if (scores[1] && scores[1].score > 0 && scores[1].score >= scores[0].score * 0.4) {
      reply += '\n\n---\n💡 น้อง Now คิดว่าอาจเกี่ยวกับ: **' + scores[1].kb.title.replace(/\(.*?\)/g,'').trim() + '** ด้วยนะคะ ลองถามเพิ่มได้เลยค่า~ 😊';
    }
    return reply;
  }

  // Fallback
  return '🤔 น้อง Now ยังหาข้อมูลที่ตรงไม่เจอเลยนะคะ ลองถามใหม่ได้นะคะ หรือจะถามเกี่ยวกับ:\n\n**ปัญหาที่น้อง Now ช่วยได้ (จาก 954 tickets จริง) นะคะ:**\n'
    + '• 📦 แพ็กเกจไม่เข้า / Entitlement (224 tickets)\n'
    + '• 📺 App TV errors: E5001, E6006, E2999:1002, จอดำ (204 tickets)\n'
    + '• 📱 App crash / error ทั่วไป (155 tickets)\n'
    + '• 📱 Mobile app issues / DRM Widevine (90 tickets)\n'
    + '• 💳 คืนเงิน / Void Transaction (43 tickets)\n'
    + '• 🎬 Partner App: WeTV, iQiyi, VIU (41 tickets)\n'
    + '• 💰 ชำระเงินไม่สำเร็จ (38 tickets)\n'
    + '• ❌ ยกเลิกแพ็กเกจ / Cancel (12 tickets)\n'
    + '• 🔐 Login หลุด / Session expire (12 tickets)\n'
    + '• 📶 ภาพกระตุก / Streaming (80 tickets)\n'
    + '• ⏪ Timeshift / ดูย้อนหลัง (7 tickets)';
}

function sendSuggestion(el) {
  var text = el.textContent;
  document.getElementById('aiInput').value = text;
  sendAIMessage();
}

function sendAIMessage() {
  var input = document.getElementById('aiInput');
  var text  = (input.value || '').trim();
  if (!text || aiLoading) return;
  input.value = '';
  autoResize(input);

  aiHistory.push({ role: 'user', text: text, time: formatTime(new Date()) });
  aiHistory.push({ role: 'thinking' });
  aiLoading = true;
  document.getElementById('aiSendBtn').disabled = true;
  renderAIMessages();

  setTimeout(function() {
    aiHistory = aiHistory.filter(function(m) { return m.role !== 'thinking'; });
    var reply = localBot(text);
    aiHistory.push({ role: 'ai', text: reply, time: formatTime(new Date()) });
    aiLoading = false;
    document.getElementById('aiSendBtn').disabled = false;
    renderAIMessages();
  }, 400);
}

function clearAIChat() {
  aiHistory = [];
  aiLoading = false;
  document.getElementById('aiSendBtn').disabled = false;
  aiHistory.push({ role: 'assistant', text: 'ล้างการสนทนาแล้วนะคะ 🐥 มีอะไรให้น้อง Now ช่วยอีกไหมคะ?', time: formatTime(new Date()) });
  renderAIMessages();
}

function handleAIKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAIMessage(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ===== Init =====
loadTDG();
setTimeout(resetCountdown, 3000);

// โหลด TVS Error KB จาก server (cache 6h)
google.script.run
  .withSuccessHandler(function(data) { kbData = data || []; })
  .withFailureHandler(function() { kbData = []; })
  .getKBData();

google.script.run
  .withSuccessHandler(function(user) {
    var name  = (user && user.name)  ? user.name  : 'User';
    var email = (user && user.email) ? user.email : '';
    currentUserEmail = email;
    var parts = name.split(' ').filter(Boolean);
    var inits = parts.length >= 2 ? (parts[0][0]+parts[1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
    document.getElementById('userAvatar').textContent = inits;
    document.getElementById('userName').textContent   = name;
    if (email) document.getElementById('userChip').title = email;
  })
  .withFailureHandler(function() {
    document.getElementById('userAvatar').textContent = 'U';
    document.getElementById('userName').textContent   = 'User';
  })
  .getCurrentUser();

  // Set น้อง Now avatar on static HTML img
  (function() {
    var el = document.getElementById('nowHeroImg');
    if (el) el.src = NOW_HERO_URL;
  })();
